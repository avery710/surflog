# Push to `staging` → lint + typecheck → build → deploy to Vercel (preview
# environment) → point the stable staging URL at it.
#
# Setup (once): see README.md "Deploys: production and staging". Needs repo secrets
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID and repo variable
# STAGING_DOMAIN (stag-wipeout.surflog.tw). App env vars (Supabase, Auth.js, CWA)
# live in the Vercel project's Preview environment, not in GitHub — `vercel
# pull` fetches them. Preview points at the staging Supabase project, never
# the production one.
#
# Migrations: the `migrate` job applies pending supabase/migrations/ to the
# STAGING Supabase project before the deploy, so new code never lands on a
# database missing its tables. Needs repo secrets SUPABASE_ACCESS_TOKEN and
# STAGING_DB_PASSWORD, and repo variable STAGING_SUPABASE_PROJECT_REF. It
# refuses the production project.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# a newer push supersedes an in-flight deploy
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Same idea as "Refuse the production domain" below: a mis-set variable
      # must never point the staging pipeline at the real data.
      - name: Refuse the production database
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF is not set (repo → Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if [ "$PROJECT_REF" = "tosozexlcqedocfcckwh" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF is the production project."
            exit 1
          fi

      - name: Link the staging project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply pending migrations
        run: supabase db push --yes | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps/PageProps are generated into .next/ by Next.js — a fresh
      # checkout doesn't have them until this runs (locally, `next dev` does it)
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - run: npm install --global vercel@latest

      - name: Pull Vercel project settings + Preview env vars
        run: vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"

      # --target=preview is explicit on purpose: without it the CLI resolved
      # the first staging deploy to target "production".
      - name: Build
        run: vercel build --target=preview --token="$VERCEL_TOKEN"

      # --archive=tgz uploads one tarball: the Hobby plan stops uploads after
      # 5000 files per 24 h ("api-upload-free"), which a few deploys use up.
      # The URL goes into a variable first so a failed deploy fails this step
      # (inside echo "$(…)" the exit code was lost and the alias step failed
      # on an empty URL instead).
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz --target=preview --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # surflog.tw belongs to production (deploy-production.yml); aliasing a
      # staging build onto it would put staging live on the real site.
      - name: Refuse the production domain
        if: ${{ vars.STAGING_DOMAIN == 'surflog.tw' || vars.STAGING_DOMAIN == 'www.surflog.tw' }}
        run: |
          echo "::error::STAGING_DOMAIN is the production domain. Set it to stag-wipeout.surflog.tw (repo → Settings → Secrets and variables → Actions → Variables)."
          exit 1

      # Each deploy gets a new random URL; Google OAuth needs one fixed
      # redirect URI, so alias every staging deploy to the same domain.
      - name: Alias stable staging URL
        if: ${{ vars.STAGING_DOMAIN != '' }}
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "${{ vars.STAGING_DOMAIN }}" --token="$VERCEL_TOKEN"

      - name: Summary
        run: |
          echo "Deployed: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ vars.STAGING_DOMAIN }}" ]; then echo "Staging: https://${{ vars.STAGING_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"; fi
