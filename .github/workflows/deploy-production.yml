# Push to `main` → lint + typecheck + test → build → deploy to Vercel
# (production environment). Production deploys get the project's production
# domains (surflog.tw, www) from Vercel itself — no alias step.
#
# Setup (once): see README.md "Deploys: production and staging". Uses the same repo
# secrets as deploy-staging.yml (VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID). App env vars live in the Vercel project's Production
# environment — `vercel pull` fetches them.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# queue production deploys instead of cancelling one halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps/PageProps are generated into .next/ by Next.js — a fresh
      # checkout doesn't have them until this runs
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - run: npm install --global vercel@latest

      - name: Pull Vercel project settings + Production env vars
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # One tarball (Hobby upload limit) and a real failure on a failed deploy:
      # see deploy-staging.yml.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Deployed to production: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
